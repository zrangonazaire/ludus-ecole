name: eduops
services:
  postgres:
    image: postgres:16-alpine
    container_name: eduops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduops
      POSTGRES_USER: eduops
      POSTGRES_PASSWORD: change_me_postgres
      TZ: Africa/Abidjan
      PGTZ: Africa/Abidjan
    ports:
    - 55432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./postgres/init:/docker-entrypoint-initdb.d:ro
    - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U eduops -d eduops
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
    - eduops-net
  redis:
    image: redis:7-alpine
    container_name: eduops-redis
    restart: unless-stopped
    command:
    - redis-server
    - /usr/local/etc/redis/redis.conf
    - --requirepass
    - change_me_redis
    ports:
    - 56379:6379
    volumes:
    - redis_data:/data
    - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - change_me_redis
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: change_me_redis
    networks:
    - eduops-net
  mailpit:
    image: axllent/mailpit:latest
    container_name: eduops-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_DATABASE: /data/mailpit.db
    ports:
    - 51025:1025
    - 58025:8025
    volumes:
    - mailpit_data:/data
    healthcheck:
      test:
      - CMD
      - /mailpit
      - readyz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
    - eduops-net
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    image: localhost:5000/eduops-backend:latest
    container_name: eduops-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: eduops
      POSTGRES_USER: eduops
      POSTGRES_PASSWORD: change_me_postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: change_me_redis
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: no-reply@eduops.local
      JWT_SECRET: change_me_this_must_be_a_very_long_random_secret_at_least_64_chars_long
      JWT_EXPIRATION: '3600000'
      JWT_REFRESH_EXPIRATION: '604800000'
      APP_BASE_URL: http://localhost:4200
      API_BASE_URL: http://localhost:8080
      SCHOOL_NAME: Groupe Scolaire Horizon
      SCHOOL_CODE: GSH
      SCHOOL_CURRENCY: XOF
      SCHOOL_TIMEZONE: Africa/Abidjan
      STUDENT_NUMBER_PATTERN: EDU-{year}-{seq:6}
      RECEIPT_NUMBER_PATTERN: REC-{year}-{seq:8}
      INVOICE_NUMBER_PATTERN: INV-{year}-{seq:8}
      EDUOPS_ADMIN_EMAIL: admin@eduops.local
      EDUOPS_ADMIN_PASSWORD: ChangeMe!2026
      TZ: Africa/Abidjan
    ports:
    - 58080:8080
    volumes:
    - backend_storage:/app/storage
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8080/actuator/health
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
    - eduops-net
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        API_BASE_URL: http://localhost:8080
    image: localhost:5000/eduops-frontend:latest
    container_name: eduops-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
    - 4200:80
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
    - eduops-net
  registry:
    image: registry:2
    container_name: eduops-registry
    restart: unless-stopped
    profiles:
    - registry
    ports:
    - 5000:5000
    volumes:
    - registry_data:/var/lib/registry
    - ./registry/config.yml:/etc/docker/registry/config.yml:ro
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:5000/v2/
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
    - eduops-net
volumes:
  postgres_data: null
  redis_data: null
  mailpit_data: null
  registry_data: null
  backend_storage: null
networks:
  eduops-net:
    driver: bridge
