name: eduops-prod
services:
  postgres:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/start-production.sh:/etc/postgresql/start-production.sh:ro
      - ./postgres/production.password:/etc/postgresql/production.password:ro
    command: []
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-U'
        - eduops
        - '-d'
        - eduops
      interval: 10s
      timeout: 5s
      retries: 10
    entrypoint:
      - /bin/sh
      - /etc/postgresql/start-production.sh
  redis:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: redis:7-alpine
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis/production.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping 2>&1 | grep -Eq '^(PONG|NOAUTH Authentication required\.)$'
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: astairenazaire/ludus-backend:1.0.0
    command:
      - '--spring.profiles.active=prod'
      - '--spring.config.additional-location=file:/app/config/application-prod.yml'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 127.0.0.1:58080:8080
    volumes:
      - backend_storage:/app/storage
      - type: bind
        source: /opt/eduops/config/application-prod.yml
        target: /app/config/application-prod.yml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - wget
        - '-qO-'
        - http://localhost:8080/actuator/health
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
  frontend:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: astairenazaire/ludus-frontend:1.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 127.0.0.1:4200:80
    healthcheck:
      test:
        - CMD
        - wget
        - '-qO-'
        - http://localhost/healthz
      interval: 15s
      timeout: 5s
      retries: 5
  gateway:
    # Reverse proxy Node.js (remplace le Nginx système). Sert le SPA, le
    # backend /api et le WebSocket /ws. Aucune dépendance externe.
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: node:22-alpine
    command:
      - node
      - /app/server.js
    volumes:
      - type: bind
        source: ./proxy
        target: /app
        read_only: true
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: '8080'
      FRONTEND_HOST: frontend
      FRONTEND_PORT: '80'
      LISTEN_PORT: '80'
    ports:
      - 127.0.0.1:8080:80
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - '-qO-'
        - http://localhost:80/healthz
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: null
  redis_data: null
  backend_storage: null
