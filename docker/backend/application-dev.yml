spring:
  datasource:
    # Values come from docker/.env via the backend service environment in
    # docker-compose.yml. Fallbacks match docker-compose.yml defaults.
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:eduops}
    username: ${POSTGRES_USER:eduops}
    password: ${POSTGRES_PASSWORD:eduops_local_pwd}
  data:
    redis:
      host: redis
      port: 6379
      password: change_me_redis
  mail:
    host: mailpit
    port: 1025
