# =====================================================================
# DEV profile - Mailpit, verbose logs, demo data loader available
# =====================================================================
spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
  mail:
    host: localhost
    port: 51025

logging:
  level:
    ci.company.eduops: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

eduops:
  diagnostics:
    # Un 500 nomme sa propre cause dans la reponse. Sur un poste de travail,
    # la trace serveur et le navigateur sont a deux fenetres l'un de l'autre,
    # mais personne ne pense a ouvrir la premiere : quatre pannes de suite ont
    # demande plusieurs tours de deduction pour une ligne deja ecrite.
    expose-internal-errors: true
  mail:
    provider: MAILPIT
  demo:
    # Loads a realistic school (school, campus, year, terms, cycles, levels,
    # classes, subjects, teachers, students, fees) on an empty database.
    enabled: true
  security:
    jwt:
      expiration-ms: 28800000    # 8 h in dev for comfort
