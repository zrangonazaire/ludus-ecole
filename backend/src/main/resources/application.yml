# =====================================================================
# EduOps - base configuration (shared by every profile)
# =====================================================================
spring:
  application:
    name: eduops
  profiles:
    active: dev

  datasource:
    # Local development ports. application-prod.yml uses Docker service names.
    url: jdbc:postgresql://localhost:55432/eduops
    username: eduops
    password: eduops_local_pwd
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: eduops-pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: false

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only validates it.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Africa/Abidjan
          batch_size: 50
          lob.non_contextual_creation: true
        order_inserts: true
        order_updates: true
        query.in_clause_parameter_padding: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  data:
    redis:
      host: localhost
      port: 56579
      password: eduops_redis_pwd
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false
      key-prefix: "eduops:"

  mail:
    host: localhost
    port: 51025
    username: ""
    password: ""
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: eduops

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  packages-to-scan: ci.company.eduops

logging:
  level:
    root: INFO
    ci.company.eduops: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [corr=%X{correlationId:-} req=%X{requestId:-} user=%X{username:-}] %logger{36} - %msg%n"

# =====================================================================
# Application-specific settings
# =====================================================================
eduops:
  api:
    base-path: /api/v1
  school:
    name: Groupe Scolaire Horizon
    code: GSH
    currency: XOF
    locale: fr-CI
    timezone: Africa/Abidjan
  numbering:
    student-pattern: EDU-{year}-{seq:6}
    receipt-pattern: REC-{year}-{seq:8}
    invoice-pattern: INV-{year}-{seq:8}
    enrollment-pattern: "ENR-{year}-{seq:6}"
    admission-pattern: "ADM-{year}-{seq:6}"
    incident-pattern: "INC-{year}-{seq:6}"
    document-pattern: "DOC-{year}-{seq:8}"
    cash-session-pattern: "CSH-{year}-{seq:6}"
  security:
    jwt:
      secret: change_me_this_must_be_a_very_long_random_secret_at_least_64_chars_long
      expiration-ms: 3600000
      refresh-expiration-ms: 604800000
      issuer: eduops
    max-failed-logins: 5
    lock-duration-minutes: 15
    password-min-length: 10
  cors:
    allowed-origins: http://localhost:4200
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  rate-limit:
    enabled: true
    login-attempts-per-minute: 10
    payment-requests-per-minute: 60
  mail:
    from: no-reply@eduops.local
    enabled: true
  app:
    base-url: http://localhost:4200
    api-url: http://localhost:8080
  storage:
    location: ./storage
  bootstrap:
    admin-email: admin@eduops.local
    admin-password: ChangeMe!2026
  academic:
    default-scale-max: 20
    default-passing-mark: 10
    rounding-decimals: 2
  events:
    relay:
      enabled: true
      batch-size: 100
      poll-interval-ms: 2000
