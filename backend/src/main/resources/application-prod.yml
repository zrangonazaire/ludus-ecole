# =====================================================================
# PROD profile - real SMTP relay, strict logging, no demo data
# Temporary HTTP on the VPS IP: restore secure cookies and require-https with TLS.
# =====================================================================
spring:
  jpa:
    properties:
      hibernate:
        format_sql: false
  datasource:
    # Docker Compose service names. Replace passwords before deployment.
    url: jdbc:postgresql://postgres:5432/eduops
    username: eduops
    password: eduops
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10
  data:
    redis:
      host: redis
      port: 6379
      password: eduops
  mail:
    host: "smtp.ton-fournisseur.com"
    port: 587
    username: "A_COMPLETER_MAIL_USERNAME"
    password: "A_COMPLETER_MAIL_PASSWORD"
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

server:
  forward-headers-strategy: framework
  error:
    include-message: never
  servlet:
    session:
      cookie:
        secure: false

logging:
  level:
    root: WARN
    ci.company.eduops: INFO
    org.hibernate.SQL: WARN

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

eduops:
  diagnostics:
    # Ecrit, pas laisse par defaut : le jour ou la valeur par defaut change,
    # c'est la production qui se mettrait a decrire ses entrailles.
    expose-internal-errors: false
  mail:
    provider: SMTP
    # No SMTP provider configured yet. Enable together with health.mail later.
    enabled: false
    from: "no-reply@ton-domaine.com"
  cors:
    allowed-origins: "http://57.129.132.150"
  app:
    base-url: "http://57.129.132.150"
    api-url: "http://57.129.132.150"
  storage:
    location: /app/storage
  bootstrap:
    admin-email: "admin@ton-domaine.com"
    admin-password: "A_COMPLETER_ADMIN_PASSWORD"
  demo:
    enabled: false
  security:
    require-https: false
    jwt:
      # Replace with a unique random secret of at least 64 characters.
      secret: "f842ceb311f2398fbb092eccf6450c1f84ae02478ef22956ddcace94375206f2ba259158247483b516fad5da2b5599d88af12421762c77c9295a7b42a31ec308"
